<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property</title>
    <link href="../CSS/property.css" rel="stylesheet">
</head>

<body>

    <div>
        <h1 id="title">Inspire Coffee</h1>
        <img id="coffeeImg" src="../Img/coffee-blue.jpg" width="200" height="200"">
    </div>

    <div>
        <button id=" btn" type=" button" onclick="handler('LG CNS Coffee', '../Img/coffee-pink.jpg')">해당 이미지의 속성을
        변경</button>
    </div>

    <script>
        const handler = (title, img) => {

            const newTitle = document.getElementById('title')
            const newImg = document.getElementById('coffeeImg')
            const newBtn = document.getElementById(' btn');

            newImg.setAttribute('src', `${img}`);
            newTitle.textContent = title;
            newBtn.textContent = "Lg CNS Coffee"
        }
        /*
        Q)
        - 1. 버튼의 이벤트를 감지하는 함수정의
        - 2. 이벤트 발생 시 H1, IMG 태그에 접근하여
        - 3. 이미지 src 속성에 접근하여 coffee-pink.jpg 변경
        - 4. h1 접근해서 텍스트를 lg Cns Coffee 변경
        - 5. 테스트가 완료되면 ai agent 도움을 받아서 css 작성하고 꾸미기 
        - 필요에 따라서 태그에 선택지를 정의 할 수 있음
        hint) 특정영역에 text 삽입 시 : textContent, innerHTML, innerText
        -
        */



    </script>
</body>

</html>
