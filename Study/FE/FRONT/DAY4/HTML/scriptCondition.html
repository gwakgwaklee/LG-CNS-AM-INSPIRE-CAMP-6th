        // 통신을 통해 서버로부터 전달 받은 데이터 형식 JSON

        // page load event

        document.querySelector("#email").value = user.email;
        document.querySelector("#pwd").value = user.password;

        document.querySelector("#signInBtn").onclick = () => {
            window.alert(`button click`);
            let email = document.querySelector("#email").value;
            let passwd = document.querySelector("#pwd").value;
            console.log(`debug >>>> email : ${email}`);
            console.log(`debug >>>> passwd : ${passwd}`);

            if (email === '' || passwd === '') {
                // 이메일 또는 패스워드가 비어있을 때
                document.querySelector("#err_empty_email_pwd").style.display = "block"; // 에러 메시지 div를 보이게 함
            } else {
                // 이메일과 패스워드가 모두 입력되었을 때
                document.querySelector("#err_empty_email_pwd").style.display = "none"; // 에러 메시지 div를 숨김
                location.href = `thanks.html?email=${email}$password=${passwd}`;
                // 여기에 로그인 처리 로직을 추가할 수 있습니다.
