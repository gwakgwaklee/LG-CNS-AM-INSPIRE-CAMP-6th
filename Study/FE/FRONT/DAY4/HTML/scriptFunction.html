<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script Function</title>
</head>

<body>
    <script>
        function test(x, y) {
            return x + y;
        };

        let result = test(10, 20)

        console.log(`debug >>>> result :  ${result}`);

        let btnHandler = function () {
            console.log(`익명의 함수입니다`);
        };

        console.log(`debug >>>> function type ${typeof btnHandler}`);
        btnHandler();

        // es6 : array function 
        let arrowfunction = () => {
            console.log(`화살표 함수 호출[]`)
        };
        arrowfunction();
        let add = (a, b) => {
            // return을 무조건 사용해 줘야한다. 
            return a + b;
        };
        console.log(`debug >>>> add function ${add(10, 30)}`);

        let obj = {
            name: "jslim",
            study: function () {
                return ["html", "script", "css"];
            }
        };

        let ary = obj.study();
        console.log(`debug >>>> ary`, ary);

        // es6
        // 구조분해 - Destructuring
        let html = "html";
        let script = "script";
        let css = "css";
        // 변수의 이름과 키 이름이 동일할 경우 축약 문법 가능하다.
        obj = {
            name: "jslim",
            study: function () {
                return {
                    html: "html",
                    script: "script",
                    css: "css"
                }
            }
        };

        let instance = obj.study();
        console.log(`debug >>>> html : `, instance.html);

        console.log(`debug >>>> 배열변수와 함께 사용하는 함수와 람다식`);
        const ages = [20, 24, 26, 30, 34, 35];

        const newAges = ages.map(age => age * 2);
        console.log(`debug >>>> newAges `, newAges);

        const evenAges = ages.filter(age => age % 2 === 0);
        console.log(`debug >>>> evenAges `, evenAges);


        /*
        - Q1 email값을 key로하고 nickName 값을 value로하는 새로운 객체를 만들려고 한다.
        - 즉, 배열을 가공해서 하나의 객체로 합치는 것 
        hint)
        - array : reduce() 함수
        */
        const userAry = [
            { email: "naver.com", nickName: "IronMan" },
            { email: "google.com", nickName: "Bob" },
            { email: "daum.com", nickName: "Alice" }
        ];

        const Q1 = userAry.reduce((obj, cur) => {
            obj[cur.email] = cur.nickName;
            return obj;
        }, {});

        console.log(`Q1 :`, Q1)
    </script>
</body>

</html>
